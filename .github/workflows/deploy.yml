name: Deploy / Publish Pipeline Snapshot

on:
  push:
    branches:
      - main

jobs:
  publish-pipeline-snapshot:
    name: Run Dockerized pipeline and publish artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare Docker env file
        run: |
          cp .env.example .env

      - name: Validate configuration files
        run: |
          test -f config/config.yaml
          test -f config/logging.yaml

      - name: Build Dagster image
        run: |
          docker compose build dagster-code

      - name: Start Docker Compose stack
        run: |
          docker compose up -d postgres dagster-code dagster-webserver dagster-daemon

      - name: Run pipeline
        run: |
          docker compose run --rm dagster-code python -m dagster job execute -f orchestration/definitions.py -j openf1_ingestion_job

      - name: Upload raw data snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openf1-raw-data-${{ github.sha }}
          path: data/raw
          if-no-files-found: warn

      - name: Upload Dagster run metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dagster-run-metadata-${{ github.sha }}
          path: dagster_home
          if-no-files-found: warn

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts-${{ github.sha }}
          path: dbt/formula1_extended/target
          if-no-files-found: warn

      - name: Tear down Docker Compose services
        if: always()
        run: |
          docker compose down -v
